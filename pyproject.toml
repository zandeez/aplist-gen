[project]
name = "aplist-gen"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Andrew Cassidy", email = "andee@bytz.co.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "pysnmp>=7.1.29",
]

[project.scripts]
aplist-gen = "aplist_gen:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
